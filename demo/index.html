<!doctype html>
<html lang="en" class="pf-v6-theme-dark">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asago · Policy to guardrail recommendation</title>
    <link rel="stylesheet" href="./vendor/patternfly.css" />
    <link rel="stylesheet" href="./vendor/branding.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./data/snapshot.js"></script>
    <script src="./app.js" defer></script>
  </head>
  <body class="asago-report">
    <header class="asago-header studio-header">
      <div class="brand">
        <img src="./vendor/logo.svg" alt="Asago" class="asago-logo" /><span class="asago-product">Recommender demo</span>
      </div>
      <nav aria-label="Demo utilities">
        <button id="theme" class="quiet" aria-label="Toggle light and dark appearance">Light mode</button>
      </nav>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="eyebrow">POLICY-DRIVEN AGENTIC RED TEAMING</p>
          <h1 class="asago-title">From policy to guardrail recommendation.</h1>
        </div>
        <div class="launch">
          <button id="run-next" class="primary">Run policy mapper <span aria-hidden="true">→</span></button>
          <button id="run-all" class="secondary">Run all</button>
          <button id="reset" class="quiet">Reset</button>
        </div>
      </section>
      <section class="saved-demo" aria-label="Pre-loaded use case">
        <div>
          <strong>Pre-loaded use case</strong>
          <p id="replay-label"></p>
        </div>
        <button id="desc-open" class="secondary" type="button">View use case description</button>
      </section>
      <section class="context-strip" aria-label="Demo context">
        <span class="history-control"><label for="uc-select">USE CASE</label><select id="uc-select"></select></span>
        <span><small>SYSTEM</small><strong id="ctx-system"></strong></span>
        <span><small>POLICY</small><strong id="ctx-policy"></strong></span>
        <span><small>MODELS</small><strong id="ctx-models"></strong></span>
      </section>
      <nav class="pipeline" id="pipeline" aria-label="Pipeline stages"></nav>
      <section class="result-shell">
        <header class="result-heading">
          <div>
            <p class="eyebrow" id="panel-kicker"></p>
            <h2 id="panel-title"></h2>
            <p id="panel-description"></p>
          </div>
          <div class="result-actions"><span id="panel-badge" class="badge saved"></span></div>
        </header>
        <div id="progress" class="progress" role="status" hidden>
          <p id="progress-text"></p>
          <div class="progress-track"><i id="progress-bar"></i></div>
        </div>
        <div id="subtabs" class="subtabs" role="tablist" aria-label="Sub-components" hidden></div>
        <div id="results"></div>
      </section>
      <footer>
        <span>Asago · Policy → scenario → artifact → recommender</span>
        <span id="footer-replay"></span>
      </footer>
    </main>
    <dialog id="desc-dialog" aria-labelledby="desc-title">
      <div class="dialog-title">
        <div>
          <p class="eyebrow">USE CASE</p>
          <h2 id="desc-title"></h2>
        </div>
        <button type="button" id="desc-close" class="quiet" aria-label="Close">✕</button>
      </div>
      <pre id="desc-body" class="desc-body"></pre>
    </dialog>
  </body>
</html>
