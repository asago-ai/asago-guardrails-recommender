  governance_only: true
- risk_card:
    risk_id: atlas-poor-model-accuracy
    risk_name: Poor model accuracy
    risk_description: Poor model accuracy occurs when a model's performance is insufficient
      to the task it was designed for. Low accuracy might occur if the model is not
      correctly engineered, or if the model's expected inputs change.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI systems may produce 'hallucinations' or incorrect fact-based
      outputs, such as inaccurate instructions for IT administrators or distorted
      statistics.
    threat_source: The generative AI system's inherent imperfection in providing accurate,
      current, or context-aware information.
    vulnerability: The system's inability to account for organizational culture, industry
      intricacies, current legislation, or specific regulatory requirements like GDPR.
    consequence: Employees may make key decisions, public claims, or technical configurations
      based on erroneous information.
    impact: The company may suffer from data loss, system damage, financial harm,
      reputational damage, or non-compliance with legal and regulatory standards.
