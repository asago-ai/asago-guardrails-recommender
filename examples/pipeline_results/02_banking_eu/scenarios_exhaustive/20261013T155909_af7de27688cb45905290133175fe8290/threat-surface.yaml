- risk_card:
    risk_id: atlas-legal-accountability
    risk_name: Legal accountability
    risk_description: Determining who is responsible for an AI model is challenging
      without good documentation and governance processes. The use of synthetic data
      in model development adds further complexity, since the lack of standardized
      frameworks for recording synthetic data design choices and verification steps
      makes accountability harder to establish.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may fail to provide required attribution for generative AI outputs
      or inadvertently use AI-generated content in ways that violate external terms
      of use or open-source licenses.
    threat_source: Employees using generative AI systems for internal documents, external
      communications, or programming code without adhering to specific attribution
      requirements.
    vulnerability: The inability to dependably detect if an employee's work is original
      versus AI-generated, combined with the complexity of tracking open-source software
      (OSS) licenses used in AI training data.
    consequence: The firm may face liability for violations of external terms of use,
      copyright infringement, or breaches of approved open-source license restrictions.
    impact: Legal disputes over proprietary IP, potential invalidation of copyrighted
      work, and damage to the firm's external reputation.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-improper-usage
    risk_name: Improper usage
    risk_description: Improper usage occurs when a model is used for a purpose that
      it was not originally designed for.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may rely on generative AI for high-stakes tasks such as providing
      IT administration instructions, legal/tax advice, or statistical analysis despite
      the system's tendency to hallucinate.
    threat_source: Employees or users applying generative AI to domains it was not
      designed for, such as accounting, legislation, or technical system administration.
    vulnerability: The inherent tendency of generative AI systems to produce convincing
      but factually incorrect 'hallucinations' and their lack of awareness regarding
      specific legislation or organizational culture.
    consequence: The generation of inaccurate instructions, distorted statistics,
      or erroneous legal/tax advice.
    impact: Severe organizational harm including data loss, system damage, incorrect
      key business decisions, or legal non-compliance regarding GDPR and other applicable
      laws.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-dangerous-use
    risk_name: Dangerous use
    risk_description: Generative AI models might be used with the sole intention of
      harming people.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may utilize generative AI systems for nefarious purposes, including
      proxy avoidance, unapproved network uses, or the manipulation of financial services
      transactions for personal gain.
    threat_source: Employees acting with the sole intention of harming people or seeking
      personal advantage.
    vulnerability: The ability of users to leverage the system's capabilities to bypass
      existing security protocols or manipulate financial processes.
    consequence: The execution of unauthorized network activities or the fraudulent
      manipulation of financial transactions.
    impact: Direct harm to the organization through financial loss, compromised network
      integrity, and potential legal or regulatory repercussions.
  owasp_llm_ids: []
