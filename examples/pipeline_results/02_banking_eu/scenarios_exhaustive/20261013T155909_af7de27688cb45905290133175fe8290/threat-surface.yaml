- risk_card:
    risk_id: atlas-harmful-code-generation
    risk_name: Harmful code generation
    risk_description: Models might generate code that causes harm or unintentionally
      affects other systems.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The generation of inaccurate instructions for IT administrators or code
      that facilitates unapproved network uses and proxy avoidance.
    threat_source: Generative AI systems that hallucinate or fail to account for organizational
      intricacies and current legislation.
    vulnerability: The inherent tendency of generative AI to produce convincing but
      factually incorrect or contextually inappropriate outputs.
    consequence: Direct system damage, data loss, or the manipulation of financial
      services transactions.
    impact: Severe operational issues for companies, including legal non-compliance
      with GDPR and significant financial or reputational harm.
