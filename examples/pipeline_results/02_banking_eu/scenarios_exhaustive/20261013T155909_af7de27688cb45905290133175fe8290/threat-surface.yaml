- risk_card:
    risk_id: atlas-model-usage-rights
    risk_name: Model usage rights restrictions
    risk_description: Terms of service, licenses, or other rules restrict the use
      of certain models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Users may fail to provide required attribution for generative AI outputs
      or inadvertently violate open-source software (OSS) licenses embedded in the
      training data.
    threat_source: Employees using commercial generative AI tools and external systems
      with specific Terms of Use or OSS-based training sets.
    vulnerability: The inability of current detection tools to reliably determine
      if an employee's work is original or derived from specific licensed code/content.
    consequence: The firm may face legal liability for terms of service violations,
      copyright infringement, or breaches of open-source licenses.
    impact: Potential invalidation of proprietary or copyrighted work, conflicts with
      other firms using similar output, and damage to the firm's external reputation.
