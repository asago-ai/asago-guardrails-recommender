    risk_id: atlas-personal-information-in-prompt
    risk_name: Personal information in prompt
    risk_description: Personal information or sensitive personal information that
      is included as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may include NPI, PII, or sensitive intellectual property within
