- risk_card:
    risk_id: atlas-over-or-under-reliance
    risk_name: Over- or under-reliance
    risk_description: In AI-assisted decision-making tasks, reliance measures how
      much a person trusts (and potentially acts on) a model's output. Over-reliance
      occurs when a person puts too much trust in a model, accepting a model's output
      when the model's output is likely incorrect. Under-reliance is the opposite,
      where the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may accept hallucinated or factually incorrect generative AI
      outputs as accurate, or conversely, disregard valid model outputs.
    threat_source: Users interacting with generative AI systems that produce convincing
      but erroneous fact-based outputs.
    vulnerability: The inherent tendency of generative AI to hallucinate and its lack
      of awareness regarding current legislation, organizational culture, or industry
      intricacies.
    consequence: The implementation of inaccurate IT instructions, distorted statistics,
      or incorrect legal and tax advice within business processes.
    impact: Severe organizational harm including data loss, system damage, fraudulent
      transactions, regulatory non-compliance, and reputational or financial damage.
