- risk_card:
    risk_id: atlas-unreliable-source-attribution
    risk_name: Unreliable source attribution
    risk_description: Source attribution is the AI system's ability to describe from
      what training data it generated a portion or all its output. Since current techniques
      are based on approximations, attributions might be incorrect.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: The AI system provides incorrect or approximate source attributions for
      its generated content.
    threat_source: Current AI technical limitations where attribution techniques rely
      on approximations rather than exact data mapping.
    vulnerability: The user's reliance on the system's ability to accurately identify
      training data origins to fulfill attribution requirements.
    consequence: Users may inadvertently fail to correctly attribute output or misidentify
      the source of proprietary and copyrighted material.
    impact: Users face potential copyright violations, invalidation of output for
      proprietary work, and legal or ethical conflicts with other firms.
  owasp_llm_ids: []
