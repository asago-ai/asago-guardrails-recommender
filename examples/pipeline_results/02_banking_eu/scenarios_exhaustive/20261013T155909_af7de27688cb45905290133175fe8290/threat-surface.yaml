- risk_card:
    risk_id: atlas-spreading-disinformation
    risk_name: Spreading disinformation
    risk_description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may use generative AI to create misleading internal or external
      communications, such as employee appraisals or official documents, without proper
      human oversight or attribution.
    threat_source: Employees or managers using generative AI systems to automate tasks
      like writing HR documents or emails to save time.
    vulnerability: The lack of human-authored content and the failure to adhere to
      attribution requirements or perform strong reviews on AI-generated outputs.
    consequence: The production of inaccurate or deceptive information that stands
      in for an employee's actual activity or professional judgment.
    impact: Legal and ethical grievances from employees, potential invalidation of
      proprietary work, and the erosion of organizational trust through the dissemination
      of non-human authored misinformation.
