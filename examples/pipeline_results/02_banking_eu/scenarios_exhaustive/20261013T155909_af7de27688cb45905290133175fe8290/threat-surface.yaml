    risk_name: Non-disclosure
    risk_description: Content might not be clearly disclosed as AI generated.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users may fail to provide required attribution for generative AI outputs
      as mandated by the commercial tools' Terms of Use.
    threat_source: Employees utilizing generative AI systems without adhering to external
      attribution requirements.
    vulnerability: The tendency for users to not attribute output to AI and the current
      lack of dependable tools to detect if work is original or AI-generated.
    consequence: The firm may become liable for violations of the external systems'
      Terms of Use.
    impact: The firm's external reputation may be compromised and legal or contractual
      compliance regarding open-source licenses and proprietary IP may be breached.
