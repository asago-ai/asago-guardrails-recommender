- risk_card:
    risk_id: atlas-data-privacy-rights
    risk_name: Data privacy rights alignment
    risk_description: Applicable laws can establish data subject rights such as opt-out
      rights, right to access, and right to be forgotten. Synthetic data might raise
      unique concerns, such as the potential for reidentification of individuals from
      seemingly anonymous synthetic data. Data subject rights might also be relevant
      in scenarios where synthetic data is derived from sensitive or personal information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Individuals may be re-identified from seemingly anonymous synthetic data
      or multimedia outputs generated by tools like Stable Diffusion, Midjourney,
      or DALL-E.
    threat_source: The use of latent diffusion models (LDMs) and other multimedia
      creation tools trained on sensitive or personal information.
    vulnerability: The potential for synthetic data or AI-generated imagery to retain
      identifiable patterns from the underlying sensitive datasets used during training.
    consequence: A violation of data subject rights, such as the right to be forgotten
      or the right to opt-out, as personal information is inadvertently reconstructed.
    impact: Legal non-compliance with applicable data privacy laws and the erosion
      of privacy for individuals whose data is embedded in AI-generated content.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-exposing-personal-information
    risk_name: Exposing personal information
    risk_description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI models, such as LLMs or image generation tools like Stable
      Diffusion, may reveal PII or SPI within their generated outputs.
    threat_source: The use of PII/SPI in training data, fine-tuning data, seed data
      for synthetic generation, or within user prompts.
    vulnerability: The inherent capability of external generative AI services to memorize
      and reconstruct sensitive data provided during the model's development or input
      phase.
    consequence: The direct leakage of personal identifiable information or sensitive
      personal information through the model's text or multimedia outputs.
    impact: Potential privacy violations and data breaches affecting individuals or
      the firm when using external services like ChatGPT, Bing, or Midjourney.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-copyright-infringement
    risk_name: Copyright infringement
    risk_description: A model might generate content that is similar or identical
      to existing work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI tools may produce programming code or multimedia content
      that replicates existing work protected by open-source licenses or commercial
      terms of use requiring attribution.
    threat_source: Generative AI systems trained on open-source software (OSS) repositories
      and other copyrighted datasets.
    vulnerability: The inability of current detection tools to reliably verify if
      an employee's work is original and the tendency of users to omit required attribution
      for AI-generated output.
    consequence: Firms may violate specific open-source licenses or commercial terms
      of use, and employees may fail to provide necessary attribution to external
      systems.
    impact: The firm faces legal liability for license violations and potential damage
      to its external reputation.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-revealing-confidential-information
    risk_name: Revealing confidential information
    risk_description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Models such as BloombergGPT, GitHub CoPilot, or OpenAI's DALL-E may output
      sensitive data contained within their training sets, fine-tuning datasets, or
      user prompts.
    threat_source: The integration of proprietary datasets into LLMs (like BloombergGPT)
      or the inclusion of confidential code and text in Microsoft O365 and GitHub
      CoPilot prompts.
    vulnerability: The inherent tendency of generative models to memorize and reconstruct
      specific patterns from their training data or context windows during inference.
    consequence: The direct leakage of confidential information, proprietary code,
      or private multimedia assets through model-generated outputs.
    impact: Severe breaches of intellectual property, loss of competitive advantage
      for organizations, and violations of data privacy for individuals.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-usage
    risk_name: Data usage restrictions
    risk_description: Laws and other restrictions can limit or prohibit the use of
      some data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Employees may use external generative AI services, such as ChatGPT or
      Google Bard, for specific use cases that violate legal or regulatory data usage
      restrictions.
    threat_source: Employees utilizing external, unvetted generative AI services for
      business tasks.
    vulnerability: The use of external generative AI services that operate outside
      the firm's internal hosting and direct control.
    consequence: The firm may inadvertently process or utilize data in a manner that
      is prohibited by law or specific data usage restrictions.
    impact: Potential regulatory non-compliance and the erosion of trust between financial
      institutions, customers, and other firms.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-nonconsensual-use
    risk_name: Nonconsensual use
    risk_description: Generative AI models might be intentionally used to imitate
      people through deepfakes by using video, images, audio, or other modalities
      without their consent.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: External generative AI services, such as ChatGPT, Bing, or Bard, may be
      utilized to create deepfakes by imitating individuals through unauthorized video,
      image, or audio generation.
    threat_source: Users of external, non-firm-hosted generative AI services.
    vulnerability: The accessibility and capability of third-party generative AI models
      to process and synthesize various modalities without built-in consent verification.
    consequence: The production of highly realistic but nonconsensual synthetic media
      that mimics specific people.
    impact: Potential reputational damage, identity theft, or psychological harm to
      individuals targeted by the deepfakes.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-personal-information-in-data
    risk_name: Personal information in data
    risk_description: Inclusion or presence of personal identifiable information (PII)
      and sensitive personal information (SPI) in the data used for training or fine
      tuning the model might result in unwanted disclosure of that information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: The inclusion of PII, NPI, or sensitive personal information within queries
      or inputs provided to external generative AI services.
    threat_source: Employees using external generative AI systems like ChatGPT, Bing,
      or Bard for business-related tasks.
    vulnerability: The failure of employees to genericize requests, remove references
      to the firm, or strip out sensitive data before inputting it into third-party
      systems.
    consequence: The unwanted disclosure of personal identifiable information (PII)
      or sensitive personal information (SPI) to external service providers.
    impact: Potential breaches of compliance, loss of intellectual property, and harm
      to individual privacy through the exposure of sensitive data to third-party
      AI models.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-information-in-data
    risk_name: Confidential information in data
    risk_description: Confidential information might be included as part of the data
      that is used to train or tune the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential firm information may be ingested into the training or tuning
      datasets of external generative AI services like ChatGPT, Bing, or Bard.
    threat_source: The use of external, non-firm-hosted generative AI services for
      processing or fine-tuning models.
    vulnerability: The lack of internal hosting and the inherent data-sharing nature
      of external LLM platforms.
    consequence: Proprietary or sensitive data becomes part of the external provider's
      model weights or training corpus.
    impact: Potential leakage of firm-specific intellectual property or confidential
      data to third-party providers and other users of the external service.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-data-in-prompt
    risk_name: Confidential data in prompt
    risk_description: Confidential information might be included as a part of the
      prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential information, including Intellectual Property (IP), Non-Public
      Information (NPI), and Personally Identifiable Information (PII), is included
      within the prompts or queries sent to external generative AI services.
    threat_source: Employees using external generative AI services such as ChatGPT,
      Bing with GPT, or Google Bard.
    vulnerability: Failure by employees to genericize requests, remove references
      to the firm, or strip sensitive data like variable names and NPI from their
      inputs.
    consequence: The transmission of sensitive firm-specific data to third-party external
      AI providers.
    impact: Potential loss of intellectual property, breach of compliance standards,
      and exposure of private individual data through third-party systems.
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
