- risk_card:
    risk_id: atlas-output-bias
    risk_name: Output bias
    risk_description: Generated content might unfairly represent certain groups or
      individuals.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Generative AI output may unfairly represent certain groups or individuals
      when used for sensitive tasks like writing employee appraisals.
    threat_source: Generative AI systems used by employees for internal or external
      communications.
    vulnerability: The lack of human authorship and the potential for the output to
      stand in for an employee's own judgment or voice.
    consequence: An employee may file a successful grievance if they believe an AI-generated
      appraisal is unfair or inaccurate.
    impact: Potential damage to the firm's internal employee relations and the upholding
      of grievances due to perceived lack of human oversight.
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
