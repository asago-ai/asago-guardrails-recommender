    vulnerability: The failure to genericize requests or remove references to the
      firm, NPI, and PII before inputting data into third-party AI systems.
    consequence: Sensitive personal information or proprietary company data is transmitted
      to and processed by an external third-party system.
    impact: Potential breaches of compliance, loss of intellectual property, and failure
      to safeguard against malicious activity or data exposure.
