    risk_id: atlas-data-usage-rights
    risk_name: Data usage rights restrictions
    risk_description: Terms of service, license compliance, or other IP issues may
      restrict the ability to use certain data for building models.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Employees may use generative AI outputs for proprietary or copyrighted
      work without adhering to required attribution or license stipulations.
    threat_source: Users of external generative AI systems, such as employees utilizing
      APIs or UIs for company tasks.
    vulnerability: The lack of awareness or failure to follow specific terms of use,
      such as OpenAI's attribution requirements, and the inherent difficulty in covering
      all use cases in a single policy.
    consequence: The invalidation of outputs for proprietary use and the exposure
      of users to copyright violations or conflicts with other firms using similar
      outputs.
    impact: Legal and regulatory non-compliance, potential loss of intellectual property
      protections, and damage to the company's legal standing and ethical reputation.
