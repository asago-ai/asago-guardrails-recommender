  - step_number: 2
    zone: outside
    action: The attacker crafts a sophisticated multi-part adversarial prompt designed
      to override the assistant's safety guardrails and intent recognition.
    effect: The attacker creates a payload capable of hijacking the agent's reasoning
      process. The payload is then delivered to the system.
