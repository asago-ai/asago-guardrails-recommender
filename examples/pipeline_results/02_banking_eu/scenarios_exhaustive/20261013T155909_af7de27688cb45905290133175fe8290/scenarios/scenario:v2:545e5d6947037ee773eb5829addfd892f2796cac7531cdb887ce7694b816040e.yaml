narrative:
  title: Hijacking delegated payment authority through conversational instruction
    injection
  summary: An advanced adversarial user exploits the EuroBank assistant's reasoning
    engine by injecting malicious instructions into a legitimate customer session.
    By manipulating the conversational context, the attacker tricks the LLM into misinterpreting
    the user's intent, causing it to autonomously invoke the payment processing API
    to execute unauthorized SEPA transfers. This attack hijacks the agent's delegated
    authority, ensuring the fraudulent transactions are incorrectly attributed to
    the authenticated user's identity.
  entry_point: customer requests via banking app and web interface
  zone_sequence:
  - outside
  - input
  - reasoning
  - tool_execution
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the standard conversational flow and response patterns
      of the EuroBank assistant through the mobile banking app interface.
    effect: The attacker gains insight into how the assistant maps natural language
      to banking workflows. With the system's behavior understood, the attacker prepares
      the exploit.
    control_point: null
    projected_step_ids:
    - discover_capabilities
    realizations:
    - projected_step_id: discover_capabilities
      action_kind: observe
