  desires:
  - I want to hijack the agent's delegated authority to execute unauthorized SEPA
    payments under the legitimate user's identity.
  intentions:
  - I will inject adversarial instructions into the chat via the banking app to trick
    the reasoning engine into autonomously invoking the payment processing API for
    a high-value transfer.
  resources:
  - customer requests via banking app and web interface
