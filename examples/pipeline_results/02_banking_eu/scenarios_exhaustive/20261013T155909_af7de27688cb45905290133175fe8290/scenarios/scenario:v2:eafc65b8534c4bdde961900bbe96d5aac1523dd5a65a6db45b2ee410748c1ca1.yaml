narrative:
  title: Poisoning persistent memory to automate unauthorized loan parameter manipulation
  summary: An advanced adversarial user exploits the banking app's conversational
    interface to inject deceptive directives into the assistant's cross-session memory.
    By embedding hidden instructions during a legitimate session, the attacker ensures
    that future, independent sessions trigger the autonomous misuse of the loan management
    API to modify sensitive application parameters, effectively bypassing real-time
    session-level oversight through poisoned context retrieval.
  entry_point: customer requests via banking app and web interface
  zone_sequence:
  - outside
  - input
  - reasoning
  - memory
  - tool_execution
  steps:
  - step_number: 1
    zone: outside
    action: The attacker prepares a sophisticated payload containing deceptive operational
      directives designed to be stored as high-priority context, then identifies a
      low-activity window to initiate the injection via the banking app interface.
    effect: The groundwork is laid for a multi-session attack that relies on the system's
      internal state rather than immediate interaction. Having prepared the payload,
      the attacker proceeds to the delivery phase.
    control_point: null
    projected_step_ids:
