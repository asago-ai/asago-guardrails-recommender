      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.craft.payload
  - step_number: 3
    zone: input
    action: The attacker delivers the deceptive prompt via the customer requests via
      banking app and web interface.
    effect: The malicious instructions enter the system's input surface, targeting
      the model's reasoning logic. The input is passed to the model for processing.
    control_point: null
    projected_step_ids:
    - deliver_payload
    realizations:
    - projected_step_id: deliver_payload
      action_kind: deliver
      executor_role: attacker
      boundary_position: crossing
      resource_ref_ids:
      - ep:v1:4012e199b8e335bd87b8fa79c992022a
      consumed_ref_ids:
      - payload.chaining.request
      produced_ref_ids:
      - input.submitted
      produced_effect_ids: []
      outcome_link_pc_ids:
      - post.deliver.payload
      postcondition_ids:
      - post.deliver.payload
  - step_number: 4
    zone: reasoning
    action: The assistant's reasoning engine processes the prompt and autonomously
      decides to invoke the customer data store API to fulfill the deceptive request
      [AML.T0053].
    effect: The agent retrieves highly sensitive personal and financial information,
      including tax residency and account details. The agent observes the retrieved
      data and prepares the next step.
    control_point: null
    projected_step_ids:
    - execute_injection
    realizations:
    - projected_step_id: execute_injection
      action_kind: invoke
      executor_role: attacker
      boundary_position: inside
      resource_ref_ids: []
      consumed_ref_ids:
      - input.submitted
      produced_ref_ids:
      - chain.committed
      produced_effect_ids: []
      outcome_link_pc_ids:
      - post.execute.injection
      postcondition_ids:
      - post.execute.injection
  - step_number: 5
    zone: reasoning
    action: The reasoning engine observes the sensitive data returned from the data
      store and, following the attacker's steered logic, prepares to incorporate this
      data into a subsequent tool call.
    effect: The sensitive information is now held within the model's active context,
      ready for misuse. The agent proceeds to execute the second part of the chain.
