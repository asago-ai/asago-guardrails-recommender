- risk_card:
    risk_id: atlas-harmful-output
    risk_name: Harmful output
    risk_description: A model might generate language that leads to physical harm.  The
      language might include overtly violent, covertly dangerous, or otherwise indirectly
      unsafe statements.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model generates language that could lead to physical harm, including overtly
      violent, covertly dangerous, or indirectly unsafe content
    threat_source: Malicious user; insufficiently constrained prompt; model's learned
      patterns from harmful training data
    vulnerability: Model has learned harmful patterns from training data and lacks
      sufficient output filtering or refusal mechanisms
    consequence: Model produces content that could lead to physical harm or dangerous
      actions
    impact: Physical harm to individuals; liability for deploying organization; psychological
      harm to recipients
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-bias
    risk_name: Data bias
    risk_description: Historical and societal biases might be present in data that
      are used to train and fine-tune models. Biases can also be inherited from seed
      data or exacerbated by synthetic data generation methods.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Training data contains historical or societal biases that the model learns
      and reproduces
    threat_source: Biased data collection; historical discrimination encoded in datasets;
      synthetic data amplifying skew
    vulnerability: Model learns and amplifies statistical patterns in training data
      without fairness constraints or bias correction
    consequence: Model learns and reproduces biases present in training data, producing
      skewed outputs
    impact: Discriminatory outcomes; unfair treatment of protected groups; reinforcement
      of historical inequities
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-copyright-infringement
    risk_name: Copyright infringement
    risk_description: A model might generate content that is similar or identical
      to existing work protected by copyright or covered by open-source license agreement.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model generates content that is similar or identical to existing copyrighted
      works
    threat_source: Model trained on copyrighted material; user requesting reproduction
      of protected works
    vulnerability: Model has memorized copyrighted content from training data and
      can reproduce it when prompted
    consequence: Model reproduces copyrighted content in its output
    impact: Legal liability for copyright violation; financial damages; injunctions
      against model use
  owasp_llm_ids: []
