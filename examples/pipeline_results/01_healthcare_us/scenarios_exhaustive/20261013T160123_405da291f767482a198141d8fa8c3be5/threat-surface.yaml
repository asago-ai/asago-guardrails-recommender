- risk_card:
    risk_id: atlas-incomplete-usage-definition
    risk_name: Incomplete usage definition
    risk_description: Since foundation models can be used for many purposes, a model's
      intended use is important for defining the relevant risks of that model. As
      the use changes, the relevant risks might correspondingly change.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Model's intended use is insufficiently specified, leaving relevant risks
      unidentified
    threat_source: Foundation models designed for broad use without specific scope
      definition
    vulnerability: No structured process for defining and constraining intended use;
      risk assessment cannot be scoped without use definition
    consequence: Relevant risks are not identified because the model's intended use
      is not properly scoped
    impact: Unmitigated risks in deployment; model applied to contexts where its failure
      modes are unknown
