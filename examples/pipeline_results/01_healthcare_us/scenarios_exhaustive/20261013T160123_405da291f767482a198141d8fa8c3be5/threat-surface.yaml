- risk_card:
    risk_id: atlas-data-acquisition
    risk_name: Data acquisition restrictions
    risk_description: Laws and other regulations might limit the collection of certain
      types of data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Data collected in violation of legal restrictions or without proper authorization
    threat_source: Web scraping without consent; use of restricted datasets; jurisdictional
      data collection prohibitions
    vulnerability: Data collection processes do not verify legal compliance; no audit
      trail for data provenance and acquisition rights
    consequence: Training data is collected in violation of legal restrictions or
      consent requirements
    impact: Legal liability; regulatory penalties; forced model retraining or decommissioning;
