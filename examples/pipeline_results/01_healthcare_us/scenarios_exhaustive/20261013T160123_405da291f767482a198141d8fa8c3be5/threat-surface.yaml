- risk_card:
    risk_id: atlas-unexplainable-output
    risk_name: Unexplainable output
    risk_description: Explanations for model output decisions might be difficult,
      imprecise, or not possible to obtain.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model output decisions cannot be adequately explained, interpreted, or
