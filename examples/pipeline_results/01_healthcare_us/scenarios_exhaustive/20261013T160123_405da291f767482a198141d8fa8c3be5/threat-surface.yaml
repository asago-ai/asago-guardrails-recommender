- risk_card:
    risk_id: atlas-legal-accountability
    risk_name: Legal accountability
    risk_description: Determining who is responsible for an AI model is challenging
      without good documentation and governance processes. The use of synthetic data
      in model development adds further complexity, since the lack of standardized
      frameworks for recording synthetic data design choices and verification steps
      makes accountability harder to establish.
    taxonomy: ibm-risk-atlas
    confidence: 0.8086094856262207
    grounding_confidence: high
    threat: Responsibility for AI model outcomes cannot be determined due to unclear
      governance
    threat_source: Complex AI supply chains; multiple stakeholders (developer, deployer,
      user); evolving legal frameworks
    vulnerability: No clear accountability framework; documentation insufficient to
      establish liability chain
    consequence: Liability for AI model outcomes cannot be established due to unclear
      governance chains
    impact: No recourse for harmed parties; regulatory penalties; organizational legal
      exposure; erosion of public trust in AI
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-exposing-personal-information
    risk_name: Exposing personal information
    risk_description: When personal identifiable information (PII) or sensitive personal
      information (SPI) are used in training data, fine-tuning data, seed data for
      synthetic data generation, or as part of the prompt, models might reveal that
      data in the generated output. Revealing personal information is a type of data
      leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Model reveals personally identifiable or sensitive personal information
      in its output
    threat_source: PII present in training data, fine-tuning data, or prompt context;
      adversarial extraction queries
    vulnerability: Model has memorized PII from training data; no output filtering
      for personal information patterns
    consequence: Model outputs contain personally identifiable or sensitive personal
      information
    impact: Privacy violation; identity theft risk; regulatory penalties (GDPR, CCPA);
      harm to data subjects
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-personal-information-in-data
    risk_name: Personal information in data
    risk_description: Inclusion or presence of personal identifiable information (PII)
      and sensitive personal information (SPI) in the data used for training or fine
      tuning the model might result in unwanted disclosure of that information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: PII or sensitive personal information present in training data
    threat_source: Web-scraped data containing personal information; insufficient
      data anonymization
    vulnerability: Training data pipeline lacks PII detection and redaction; model
      can memorize and reproduce personal information
    consequence: Model memorizes PII from training data and can reproduce it in outputs
    impact: Privacy violation; regulatory penalties; identity theft risk for data
      subjects
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-information-in-data
    risk_name: Confidential information in data
    risk_description: Confidential information might be included as part of the data
      that is used to train or tune the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential information present in training or fine-tuning datasets
    threat_source: Inadequate data screening during training data preparation; data
      sources containing embedded secrets
    vulnerability: Training pipeline ingests data without scanning for confidential
      content; model memorizes and may reproduce it
    consequence: Model memorizes and may reproduce confidential information from training
      data
    impact: Unauthorized disclosure of trade secrets or business information; legal
      liability; competitive damage
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-privacy-rights
    risk_name: Data privacy rights alignment
    risk_description: Applicable laws can establish data subject rights such as opt-out
      rights, right to access, and right to be forgotten. Synthetic data might raise
      unique concerns, such as the potential for reidentification of individuals from
      seemingly anonymous synthetic data. Data subject rights might also be relevant
      in scenarios where synthetic data is derived from sensitive or personal information.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: AI system operations conflict with data subject rights (opt-out, access,
      deletion, portability)
    threat_source: Regulatory requirements (GDPR, CCPA); data subject requests that
      are difficult to honor in trained models
    vulnerability: Once data is incorporated into model weights, individual data subject
      rights (deletion, correction) are difficult or impossible to fulfill
    consequence: Data subject rights (deletion, access, correction) cannot be fulfilled
      once data is embedded in model weights
    impact: Regulatory non-compliance; penalties under GDPR/CCPA; forced model retraining
      to honor rights requests
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-data-usage
    risk_name: Data usage restrictions
    risk_description: Laws and other restrictions can limit or prohibit the use of
      some data for specific AI use cases.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Data used for AI purposes in violation of applicable restrictions
    threat_source: Regulatory constraints on data use for specific AI applications;
      evolving legal landscape
    vulnerability: No data usage policy enforcement mechanism; data governance does
      not track permitted uses per dataset
    consequence: Data is used for AI purposes that violate applicable restrictions
      or regulations
    impact: Regulatory penalties; legal liability; loss of data access; forced model
      retraining
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-reidentification
    risk_name: Reidentification
    risk_description: Even with the removal of personal information (PI) and sensitive
      personal information (SPI) from data, it might be possible to identify persons
      due to correlations to other features available in the data.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Individuals identified from supposedly anonymized data through correlation
      with other available features
    threat_source: Adversary with access to auxiliary datasets; model outputs revealing
      correlated features
    vulnerability: Anonymization is insufficient when correlated features remain;
      model amplifies re-identification risk through learned correlations
    consequence: Individuals are identified from supposedly anonymized data through
      feature correlation
    impact: Privacy violation; failure of anonymization guarantees; regulatory penalties;
      harm to re-identified individuals
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-personal-information-in-prompt
    risk_name: Personal information in prompt
    risk_description: Personal information or sensitive personal information that
      is included as a part of a prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Users include personal or sensitive information in prompts
    threat_source: User behavior; application design that encourages sharing personal
      context
    vulnerability: No input sanitization for PII; prompt content may be logged, stored,
      or disclosed in output
    consequence: Personal information from prompts is logged, stored, or disclosed
      in model output
    impact: Privacy violation; unintended data collection; regulatory non-compliance
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-decision-bias
    risk_name: Decision bias
    risk_description: Decision bias occurs when one group is unfairly advantaged over
      another due to decisions of the model. This might be caused by biases in the
      data and also amplified as a result of the model's training.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model decisions unfairly advantage one group over another
    threat_source: Biased training data combined with model being used for consequential
      decision-making
    vulnerability: Model applied to allocation or classification decisions without
      calibration for demographic parity or equalized outcomes
    consequence: Model decisions systematically advantage or disadvantage specific
      groups
    impact: Unfair allocation of resources or opportunities; legal liability for discrimination;
      harm to affected individuals
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
