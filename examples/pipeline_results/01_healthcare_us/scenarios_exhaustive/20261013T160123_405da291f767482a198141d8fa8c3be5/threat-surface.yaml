    risk_id: atlas-impact-on-affected-communities
    risk_name: Impact on affected communities
    risk_description: It is important to include the perspectives or concerns of communities
      that are affected by model outcomes when designing and building models. Failing
      to include these perspectives makes it difficult to understand the relevant
      context for the model and to engender trust within these communities.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model outcomes harm communities whose perspectives were not included in
      design
    threat_source: Lack of stakeholder engagement; model designed without input from
      affected populations
    vulnerability: No structured process for community engagement in model design;
      impact on affected groups not assessed pre-deployment
    consequence: Communities affected by model outcomes experience harm that could
      have been anticipated with their input
    impact: Disproportionate harm to marginalized groups; societal backlash; erosion
