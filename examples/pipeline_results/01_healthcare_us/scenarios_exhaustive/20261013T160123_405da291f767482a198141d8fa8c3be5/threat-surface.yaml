- risk_card:
    risk_id: atlas-spreading-disinformation
    risk_name: Spreading disinformation
    risk_description: Generative AI models might be used to intentionally create misleading
      or false information to deceive or influence a targeted audience.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Intentional use of model to create misleading or false information to
      deceive or influence audiences
    threat_source: Malicious actor conducting influence operations; automated disinformation
      campaigns
    vulnerability: Model generates convincing text indistinguishable from human-written
      content; no provenance marking on outputs
    consequence: Model generates convincing false information used to deceive or manipulate
      audiences
    impact: Undermined public trust; manipulation of democratic processes; financial
      fraud; societal harm from false narratives
