    threat_source: Complex deep learning architecture; inaccessible training data;
      opaque decision process
    vulnerability: Model architecture precludes faithful explanations; no interpretability
      mechanisms integrated into the system
    consequence: Users and auditors cannot understand why the model produced a specific
      output
    impact: Inability to verify correctness; regulatory non-compliance; loss of user
      trust; blocked adoption in regulated industries
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
