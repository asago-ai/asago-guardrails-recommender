- risk_card:
    risk_id: atlas-generated-content-ownership
    risk_name: Generated content ownership and IP
    risk_description: Legal uncertainty about the ownership and intellectual property
      rights of AI-generated content.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Legal uncertainty about who owns AI-generated content and associated intellectual
      property rights
    threat_source: Unsettled legal frameworks; conflicting ownership claims between
      model operators, users, and training data contributors
    vulnerability: No established legal framework for AI-generated content ownership;
      model outputs have unclear provenance chain
    consequence: Ownership of AI-generated content is disputed between model operators,
      users, and training data contributors
    impact: Legal uncertainty; inability to protect or monetize AI-generated IP; regulatory
      compliance challenges
  owasp_llm_ids: []
