- risk_card:
    risk_id: atlas-impact-on-human-agency
    risk_name: AI agents' Impact on human agency
    risk_description: AI might affect the individuals' ability to make choices and
      act independently in their best interests.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: AI affects individuals' ability to make independent choices and think
      critically
    threat_source: Persuasive AI outputs; deepfakes undermining trust; AI simplifying
      complex decisions beyond user understanding
    vulnerability: No safeguards for preserving human autonomy in AI-assisted decision-making;
      system design does not require human agency
    consequence: Individuals' capacity for independent decision-making and critical
      thinking is diminished
    impact: Reduced human autonomy; vulnerability to manipulation; deskilling; democratic
      process erosion
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-attribute-inference-attack
    risk_name: Attribute inference attack
    risk_description: An attribute inference attack repeatedly queries a model to
      detect whether certain sensitive features can be inferred about individuals
      who participated in training a model. These attacks occur when an adversary
      has some prior knowledge about the training data and uses that knowledge to
      infer the sensitive data.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Queries designed to infer sensitive attributes of individuals whose data
      was used in training
    threat_source: Adversary with partial knowledge of training data subjects
    vulnerability: Model has learned correlations between observable and sensitive
      attributes from training data
    consequence: Sensitive attributes of training data subjects are inferred through
      targeted queries
    impact: Privacy violation; exposure of sensitive personal information or intellectual
      property
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-output-bias
    risk_name: Output bias
    risk_description: Generated content might unfairly represent certain groups or
      individuals.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: medium
    threat: Model generates content that unfairly represents certain groups or individuals
    threat_source: Biased training data; model architecture amplifying skew; prompt
      context priming biased generation
    vulnerability: Model output distributions reflect and amplify biases present in
      training data without post-generation fairness checks
    consequence: Model generates content that unfairly represents or stereotypes certain
      groups
    impact: Reputational harm; discrimination; erosion of trust among affected communities
  owasp_llm_ids: []
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
  governance_only: true
- risk_card:
    risk_id: atlas-confidential-data-in-prompt
    risk_name: Confidential data in prompt
    risk_description: Confidential information might be included as a part of the
      prompt that is sent to the model.
    taxonomy: ibm-risk-atlas
    confidence: 0.0
    grounding_confidence: high
    threat: Confidential business information included in prompts sent to the model
    threat_source: User or automated workflow sending proprietary data to model API
      without sanitization
    vulnerability: No input filtering or data classification gate before prompt reaches
      the model; prompt data may be logged or used for training
    consequence: Confidential information from prompts is stored in logs, used for
      training, or disclosed in output
    impact: Breach of confidentiality; competitive intelligence exposure; regulatory
