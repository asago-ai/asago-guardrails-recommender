governance_only:
- risk_card:
    risk_id: atlas-revealing-confidential-information
    risk_name: Revealing confidential information
    risk_description: When confidential information is used in training data, fine-tuning
      data, or as part of the prompt, models might reveal that data in the generated
      output. Revealing confidential information is a type of data leakage.
    taxonomy: ibm-risk-atlas
    confidence: 0.9792664647102356
    grounding_confidence: high
    threat: Model discloses confidential business information, trade secrets, or proprietary
      data in output
    threat_source: Confidential data in training corpus or prompt context; adversarial
      extraction
    vulnerability: Model has memorized confidential content; no output filtering for
      sensitive business information
    consequence: Model outputs contain confidential business information, trade secrets,
      or proprietary data
    impact: Competitive advantage loss; breach of confidentiality agreements; legal
      liability; financial damage
  owasp_llm_ids:
  - LLM02
  agentic_threat_ids: []
  atlas_technique_ids: []
  attack_pattern_ids: []
  owasp_asi_ids: []
