  - step_number: 3
    zone: reasoning
    action: The reasoning engine interprets the request as a valid administrative
      task and autonomously invokes the retrieval process [AML.T0053], subsequently
      observing the sensitive diagnoses and clinical notes returned from the EHR.
    effect: The assistant now holds highly sensitive PHI within its active context
      window, ready for the next stage of the chain. The assistant prepares to execute
      the second part of the user's command.
