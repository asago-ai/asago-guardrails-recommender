narrative:
  title: Exfiltrating clinical PHI by hijacking demographic update workflows
  summary: An advanced adversarial user exploits the HealthHub assistant's ability
    to chain tools by prompting it to retrieve sensitive medical records and subsequently
    append that data to the patient's own demographic profile. By tricking the reasoning
    engine into treating clinical notes as information to be synchronized into communication
    preferences, the attacker successfully uses the update_patient_info tool to move
    protected health information into a less-monitored field for easy retrieval.
  entry_point: patient portal web and mobile app user inputs
  zone_sequence:
  - outside
  - input
  - reasoning
  - tool_execution
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the assistant's standard conversational flow and
      prepares a complex, multi-part prompt designed to bypass clinical safety boundaries.
    effect: The attacker establishes the necessary context to manipulate the agent's
      subsequent reasoning steps. Having prepared the payload, the attacker moves
      to the input interface.
    control_point: null
    projected_step_ids:
    - reconnaissance
    - craft_payload
