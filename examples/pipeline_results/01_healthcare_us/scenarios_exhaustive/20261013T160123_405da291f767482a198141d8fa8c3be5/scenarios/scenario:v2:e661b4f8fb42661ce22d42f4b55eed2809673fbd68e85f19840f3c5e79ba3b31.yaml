  - step_number: 2
    zone: input
    action: The attacker delivers a deceptive instruction via the patient portal web
      and mobile app user inputs, commanding the assistant to summarize recent clinical
      notes and immediately save that summary into the patient's 'communication preferences'
      field for 'record-keeping purposes'.
    effect: The assistant receives a high-privilege instruction that conflates medical
      retrieval with demographic modification. The assistant processes the request
      through its internal reasoning engine.
    control_point: null
