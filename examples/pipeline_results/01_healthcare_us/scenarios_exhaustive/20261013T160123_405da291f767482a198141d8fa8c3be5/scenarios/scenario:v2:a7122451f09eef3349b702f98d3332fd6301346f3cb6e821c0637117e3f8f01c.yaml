      - payload.tool.hijack
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.craft.payload
  - step_number: 4
    zone: reasoning
    action: The assistant's reasoning engine parses the input, but the adversarial
      instructions successfully hijack the internal logic [AML.T0053], causing the
      model to ignore its safety guidelines and predefined workflows; the model then
      delivers a deceptive confirmation to the user that it is processing a legitimate
      billing update.
    effect: The model's internal decision-making process is fully compromised, shifting
      from patient assistance to unauthorized tool execution. The hijacked reasoning
      triggers the target tool.
    control_point: null
    projected_step_ids:
    - verify_attack
    - deliver_injection
