      postcondition_ids:
      - post.gain.access
  - step_number: 3
    zone: outside
    action: The attacker submits the adversarial payload through the authenticated
      patient portal interface.
    effect: The input enters the system's processing pipeline, carrying the hidden
      instructions to hijack the agent's logic. The system begins to process the input.
    control_point: null
    projected_step_ids:
    - craft_payload
    realizations:
    - projected_step_id: craft_payload
      action_kind: prepare
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids:
