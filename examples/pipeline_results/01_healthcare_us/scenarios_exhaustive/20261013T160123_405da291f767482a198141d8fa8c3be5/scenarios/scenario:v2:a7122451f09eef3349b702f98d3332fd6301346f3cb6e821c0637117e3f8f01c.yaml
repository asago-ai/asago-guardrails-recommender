narrative:
  title: Fraudulent insurance claim submission via hijacked reasoning
  summary: An advanced adversarial user exploits the patient portal interface to inject
    malicious instructions that override the assistant's intent. By manipulating the
    model's reasoning process, the attacker forces the autonomous agent to bypass
    legitimate billing workflows and execute unauthorized insurance claims through
    the integrated backend API.
  entry_point: patient portal web and mobile app user inputs
  zone_sequence:
  - outside
  - input
  - outside
  - reasoning
  - tool_execution
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the standard conversational flow and tool response
      patterns of the patient portal assistant to identify how it processes billing
      inquiries.
    effect: This baseline understanding allows for the crafting of a highly targeted
      injection that mimics legitimate patient requests. Having mapped the system's
      behavior, the attacker prepares the exploit.
    control_point: null
    projected_step_ids:
    - reconnaissance
    realizations:
    - projected_step_id: reconnaissance
      action_kind: observe
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids: []
      produced_ref_ids:
      - recon.injection.surface
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.reconnaissance
  - step_number: 2
    zone: input
    action: The attacker crafts a complex, multi-layered prompt containing adversarial
      instructions designed to be entered via the patient portal web and mobile app
      user inputs.
    effect: The payload is prepared to deceive the model into treating the malicious
      commands as high-priority system directives rather than user queries. The malicious
      input is then transmitted to the system.
    control_point: null
    projected_step_ids:
    - gain_access
    realizations:
    - projected_step_id: gain_access
      action_kind: prepare
