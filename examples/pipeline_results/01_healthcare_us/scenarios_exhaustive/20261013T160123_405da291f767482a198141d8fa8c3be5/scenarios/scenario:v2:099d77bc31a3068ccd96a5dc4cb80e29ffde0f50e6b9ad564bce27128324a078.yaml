narrative:
  title: Deceiving human reviewers through hallucinated clinical and insurance context
  summary: An advanced adversarial user exploits the patient portal interface to inject
    fabricated medical diagnoses and fraudulent insurance identifiers into the conversation
    history. By forcing the AI to incorporate these false entities into its reasoning,
    the attacker creates a distorted decision context that is passed to human staff
    during escalation. This manipulation causes the human reviewer to approve high-value
    insurance claims based on a manufactured clinical necessity, effectively neutralizing
    the human-in-the-loop oversight mechanism.
  entry_point: patient portal web and mobile app user inputs
  zone_sequence:
  - outside
  - input
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker observes the patient portal interface to understand how the
      assistant summarizes conversation history and handles insurance claim inquiries,
      then prepares a series of complex, high-value claim requests paired with fabricated
      medical justifications to ensure a mandatory human escalation.
    effect: The attacker identifies the specific triggers required to force a transition
      from autonomous processing to human review, setting the stage for context manipulation.
      Having mapped the escalation triggers, the attacker moves to inject the malicious
      payload.
    control_point: null
    projected_step_ids:
    - discover_oversight_structure
    - probe_agent_mechanisms
    - identify_presentation_patterns
    - craft_misleading_context
    - obfuscate_malicious_content
