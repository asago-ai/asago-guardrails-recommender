faceting:
  risk_card:
    risk_id: atlas-hallucination
    risk_name: Hallucination
    risk_description: Hallucinations generate factually inaccurate or untruthful content
      relative to the model's training data or input. Hallucinations are also sometimes
      referred to lack of faithfulness or lack of groundedness. In some instances,
      synthetic data that is generated by large language models might include hallucinations
      that result in the data possibly being inaccurate, fabricated, or disconnected
      from reality. Hallucinations can compromise model performance, accuracy, and
      relevance.
    taxonomy: ibm-risk-atlas
    confidence: 0.9839752912521362
    grounding_confidence: high
    threat: Model generates factually inaccurate, ungrounded, or fabricated content
      that appears plausible
    threat_source: Queries outside training distribution; ambiguous prompts; absence
      of grounding data
    vulnerability: Model produces plausible-sounding output even when it lacks sufficient
      information, without expressing uncertainty
    consequence: Users receive and potentially act on factually incorrect information
      presented with false confidence
    impact: Misinformed decisions; propagation of false information into downstream
      systems and artifacts; erosion of trust in AI
