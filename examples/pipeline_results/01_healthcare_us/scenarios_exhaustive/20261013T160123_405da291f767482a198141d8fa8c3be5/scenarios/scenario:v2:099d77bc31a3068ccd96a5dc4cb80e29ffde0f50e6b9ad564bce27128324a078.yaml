  - step_number: 2
    zone: input
    action: The attacker delivers a series of highly specific chat messages through
      the patient portal web and mobile app user inputs, containing hallucinated medical
      diagnoses and non-existent insurance policy numbers.
    effect: The system accepts the fraudulent data as part of the active patient conversation
      context. The injected misinformation is then processed by the assistant's internal
      logic.
    control_point: null
    projected_step_ids:
