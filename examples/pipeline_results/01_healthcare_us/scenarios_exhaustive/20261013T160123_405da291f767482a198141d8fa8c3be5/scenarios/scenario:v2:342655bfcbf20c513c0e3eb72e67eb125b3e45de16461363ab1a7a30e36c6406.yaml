      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.payload_staged
  - step_number: 3
    zone: reasoning
    action: When a patient asks about their recent billing status, the assistant's
      reasoning engine retrieves the poisoned claim documents via RAG and processes
      the hidden instructions [AML.T0051.001].
    effect: The assistant's internal logic is hijacked by the embedded commands, overriding
      its standard helpful persona. The hijacked reasoning now directs the generation
      of the deceptive output.
    control_point: null
    projected_step_ids:
