      produced_ref_ids:
      - artifact.hijack_injection
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.injection_crafted
  - step_number: 2
    zone: outside
    action: The attacker injects these adversarial instructions into the insurance
      and billing claim data via the pharmacy fulfillment system's upstream feed.
    effect: The malicious instructions are now part of the unstructured text that
      the assistant's RAG pipeline will eventually retrieve. The poisoned data sits
      dormant until a patient initiates a billing inquiry.
    control_point: null
    projected_step_ids:
    - stage_social_engineering_payload
    realizations:
    - projected_step_id: stage_social_engineering_payload
      action_kind: prepare
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids:
