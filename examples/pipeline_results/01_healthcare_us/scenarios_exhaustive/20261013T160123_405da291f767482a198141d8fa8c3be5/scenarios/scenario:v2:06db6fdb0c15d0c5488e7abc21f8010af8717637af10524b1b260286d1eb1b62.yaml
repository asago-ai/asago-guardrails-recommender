narrative:
  title: Unauthorized medical record exfiltration via cross-boundary authorization
    escalation
  summary: An advanced adversarial user exploits the HealthHub assistant's implicit
    trust in its authenticated session to bypass patient-level data isolation. By
    injecting deceptive, context-heavy instructions through the patient portal, the
    attacker manipulates the reasoning engine into performing unauthorized tool invocations.
    This causes the agent to leverage its backend API credentials to retrieve sensitive
    medical records belonging to other patients, effectively escalating the user's
    access from their own profile to the broader Epic EHR database.
  entry_point: patient portal web and mobile app user inputs
  zone_sequence:
  - outside
  - input
  - reasoning
  - outside
  - reasoning
  steps:
  - step_number: 1
    zone: outside
    action: The attacker monitors the standard patient portal interface to confirm
      the assistant's typical response patterns and tool-calling behavior.
    effect: The attacker establishes a baseline for normal conversational flow and
      tool usage. Having mapped the system's standard behavior, the attacker prepares
      the exploit.
    control_point: null
    projected_step_ids:
    - reconnaissance
    realizations:
    - projected_step_id: reconnaissance
      action_kind: observe
      executor_role: attacker
      boundary_position: outside
      resource_ref_ids: []
      consumed_ref_ids: []
      produced_ref_ids:
      - recon.connected.services
      produced_effect_ids: []
      outcome_link_pc_ids: []
      postcondition_ids:
      - post.reconnaissance
  - step_number: 2
    zone: input
    action: The attacker submits a series of complex, deceptive prompts through the
      patient portal web and mobile app user inputs, masquerading as a request for
      a comparative clinical history analysis.
    effect: The malicious input enters the system's processing pipeline, carrying
      instructions designed to override standard identity boundaries. The input is
      passed to the internal processing layer.
    control_point: null
    projected_step_ids:
    - probe_trust_boundaries
    realizations:
    - projected_step_id: probe_trust_boundaries
      action_kind: observe
      executor_role: attacker
      boundary_position: crossing
      resource_ref_ids:
      - ep:v1:86bbfe40a505ca8c5decc2487195e42a
      consumed_ref_ids:
      - recon.connected.services
      produced_ref_ids:
