      - post.discover.connected.services
      postcondition_ids:
      - post.discover.connected.services
  - step_number: 4
    zone: outside
    action: The attacker crafts specific identifiers and clinical context within the
      prompt to mimic a legitimate administrative override request, and then structures
      the payload to exploit the lack of independent scope enforcement in the backend
      APIs.
    effect: The attacker has prepared a high-fidelity payload capable of triggering
      unintended tool behavior. The payload is delivered to the reasoning engine.
    control_point: null
