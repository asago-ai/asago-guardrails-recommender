faceting:
  risk_card:
    risk_id: atlas-over-or-under-reliance
    risk_name: Over- or under-reliance
    risk_description: In AI-assisted decision-making tasks, reliance measures how
      much a person trusts (and potentially acts on) a model's output. Over-reliance
      occurs when a person puts too much trust in a model, accepting a model's output
      when the model's output is likely incorrect. Under-reliance is the opposite,
      where the person doesn't trust the model but should.
    taxonomy: ibm-risk-atlas
    confidence: 0.9846274256706238
    grounding_confidence: high
    threat: "Users place inappropriate levels of trust in model outputs \u2014 either\
      \ accepting incorrect outputs or dismissing correct ones"
    threat_source: Model presenting outputs with unwarranted confidence; users lacking
      understanding of model limitations
    vulnerability: Model does not communicate uncertainty; interface design encourages
      uncritical acceptance of outputs
    consequence: Users make poor decisions by either blindly accepting incorrect outputs
      or dismissing correct ones
    impact: Suboptimal or harmful decisions; reduced human judgment capability; safety
      incidents in high-stakes domains
