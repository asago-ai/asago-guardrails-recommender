tool_inventory:
- name: retrieve_medical_records
  description: Read-only access to patient history, diagnoses, lab results, prescription
    records, immunization history, and clinical notes from Epic EHR
  tool_id: tool:v1:2da27564947c81fd6933c749a5911fa5
- name: schedule_appointment
  description: Create, modify, or cancel appointments with healthcare providers across
    45 facilities; synchronizes with Epic scheduling module
  tool_id: tool:v1:3423bec1542b40cfa00031b263096d30
- name: request_prescription_refill
  description: Submit prescription refill requests directly to pharmacy fulfillment
    system (Epic Willow); includes medication history review and formulary check
  tool_id: tool:v1:e11c85ee877e0faa9f0e7100932fdb64
- name: submit_insurance_claim
  description: Process and track insurance claims with patient billing data; write
    access to claims management system (Epic Resolute)
  tool_id: tool:v1:0f4f2eb6f425378f593a85ecfbd85e09
- name: update_patient_info
  description: Modify patient demographic information, emergency contacts, insurance
    policy details, and communication preferences in Epic master patient index
  tool_id: tool:v1:7177152b71618036e86b3449dbc0ede4
- name: human agent escalation
  description: Transfers the conversation to human healthcare staff when assistance
    is needed
  tool_id: tool:v1:34fe329b6b46631383354a9933e3fab4
- name: RAG knowledge retrieval
  description: Retrieves relevant healthcare policies, compliance guidelines, and
    HIPAA documentation
  tool_id: tool:v1:9ee6557c598388d69979d25e3d1ce84e
