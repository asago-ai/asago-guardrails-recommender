passthrough: true
rails:
  config:
    regex_detection:
      input:
        case_insensitive: true
        patterns:
        - '\b(ignore|disregard|forget|override)\b.{0,30}\b(all |any |the )?(previous|prior|above|earlier|existing|system)\b.{0,20}\b(instructions?|rules|prompts?|guidelines|polic(y|ies))\b'
        - '^\s*\[?\s*(system|developer|admin(istrator)?|root)\s*(note|message|override|prompt|instruction|update)?\s*\]?\s*:'
        - '\[\s*(system|sys|admin(istrator)?|developer|root|inst)(?=[\s_:\]-])[\w\s-]{0,30}[:\]]|<\|?\s*(system|im_start)\s*\|?>'
        - '\byou are now\b.{0,30}\b(developer|unrestricted|jailbreak|dan|god|debug|maintenance)\s+mode\b'
        - '\bnew (system )?instructions?\s*:'
  input:
    flows:
    - regex check input
